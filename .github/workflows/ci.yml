name: validate models

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # Unlike the modelling repos, this one can validate its real artefact in
      # CI: the workbook is committed, it is a few hundred KB, and the checks are
      # arithmetic rather than training. So every push re-derives the income
      # statement, both sides of the balance sheet, the cash flow statement and
      # the cross-statement ties in Python, independently of the formulas that
      # produced them, and separately checks that every line item on the
      # Validation tab still matches the IS, BS or CFS cell it was copied from.
      #
      # The Validation tab inside the workbook reports "ALL CHECKS PASS", but
      # that tick is computed by the same spreadsheet whose correctness is in
      # question. This job is the outside opinion.
      #
      # What this job does NOT check, so the badge is not read as more than it
      # is: the DCF, Ratios, Assumptions and Dashboard tabs. The valuation is
      # unvalidated by anything here.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Two steps on purpose. The first proves the validator catches faults, by
      # breaking a copy of the model and checking each break is reported. The
      # second runs it against the real model. Only doing the second would show
      # a green tick even if every comparison inside the script were inverted.
      - name: Test the validator against deliberately broken models
        run: python -m pytest

      - name: Re-derive the statements' identities and trace every line to its source tab
        run: python validate_model.py
